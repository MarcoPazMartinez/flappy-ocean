name: Generar FlappyDiver.exe

on:
  workflow_dispatch:          # boton "Run workflow" en la pestana Actions
  push:
    tags: ["v*"]              # al crear una version (v1.0, v1.1...) tambien se publica

permissions:
  contents: write             # necesario para adjuntar el .exe a un Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Generar el ejecutable
        run: pyinstaller --noconfirm --clean FlappyDiver.spec

      - name: Verificar imagenes, sonidos y base de datos del .exe
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $p = Start-Process -FilePath "dist\FlappyDiver.exe" -ArgumentList "--verificar" -Wait -PassThru
          if (Test-Path "dist\verificacion.txt") { Get-Content "dist\verificacion.txt" }
          if ($p.ExitCode -ne 0) { throw "--verificar fallo (codigo $($p.ExitCode))" }
          if (-not (Test-Path "dist\database\ranking.db")) { throw "No se creo database\ranking.db junto al .exe" }

      - name: Prueba de arranque (el juego debe seguir abierto a los 8 segundos)
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          $p = Start-Process -FilePath "dist\FlappyDiver.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "El juego se cerro solo (codigo $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "El juego arranco y siguio abierto."

      - name: Dejar solo el .exe para publicar
        run: |
          New-Item -ItemType Directory -Force -Path salida | Out-Null
          Copy-Item "dist\FlappyDiver.exe" "salida\FlappyDiver.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: FlappyDiver-windows
          path: salida/FlappyDiver.exe
          if-no-files-found: error

      - name: Adjuntar al Release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: salida/FlappyDiver.exe
